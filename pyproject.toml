[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scm-ana"
version = "0.1.0"
description = "供应链采购与降本数据分析"
requires-python = ">=3.10"
dependencies = ["pandas>=2.1", "numpy>=1.24", "openpyxl>=3.1", "pyarrow>=14"]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4", "ipykernel>=6"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["archive", "pipeline", "paths"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["analysis*", "reporting*", "sources*"]
